name: VERA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve dependencies and generate a complete lockfile
        run: npm install
      - name: Commit the regenerated lockfile on main pushes
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Update npm lockfile from resolved dependencies"
            git push
          fi
      - name: Verify clean reproducible install
        run: npm ci
      - run: npm run typecheck
      - run: npm run build
